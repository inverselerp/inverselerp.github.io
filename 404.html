(() => {
  const key = 'inverselerp-theme';
  const modes = ['light', 'dark', 'system'];
  const root = document.documentElement;
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let button;
  const normalize = (value) => modes.includes(value) ? value : 'light';
  const read = () => {
    try { return normalize(window.localStorage.getItem(key)); }
    catch { return 'light'; }
  };
  let mode = read();

  function apply() {
    const resolved = mode === 'system' ? (system.matches ? 'dark' : 'light') : mode;
    root.dataset.theme = resolved;
    root.dataset.themePreference = mode;
    root.style.colorScheme = resolved;
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content',
      resolved === 'dark' ? '#25282d' : '#dedddb');
    if (button) {
      const current = mode === 'system' ? `System (${resolved})` : mode[0].toUpperCase() + mode.slice(1);
      const next = modes[(modes.indexOf(mode) + 1) % modes.length];
      const label = `Theme: ${current}. Switch to ${next} theme.`;
      button.setAttribute('aria-label', label);
      button.title = label;
    }
  }

  // Runs before CSS/body rendering, so a saved dark preference never flashes light.
  apply();
  function bind() {
    button = document.getElementById('theme-toggle');
    if (!button) return;
    button.addEventListener('click', () => {
      mode = modes[(modes.indexOf(mode) + 1) % modes.length];
      try { window.localStorage.setItem(key, mode); } catch { /* Storage can be blocked. */ }
      apply();
    });
    apply();
    button.hidden = false;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind, { once: true });
  else bind();

  const followSystem = () => { if (mode === 'system') apply(); };
  if (system.addEventListener) system.addEventListener('change', followSystem);
  window.addEventListener('storage', (event) => {
    if (event.key === key || event.key === null) {
      mode = normalize(event.newValue);
      apply();
    }
  });
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) {
      mode = read();
      apply();
    }
  });
})();
